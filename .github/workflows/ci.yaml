name: Tests and container builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r nibe_local/requirements.txt
      - run: python tests/test_app.py
      - run: python tests/test_ui.py
      - run: python tests/test_hmi.py
      - run: python tests/test_repository.py
      - run: node tests/test_eye.js
      - run: node tests/test_hmi_ui.js
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./nibe_local
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: nibe-local-hmi:ci
      - name: Verify imports and default lock in image
        run: docker run --rm --platform ${{ matrix.platform }} --entrypoint python nibe-local-hmi:ci -c 'import nibe_app; assert nibe_app.WRITES_LOCKED is True'
